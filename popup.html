<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: sans-serif; padding: 12px; text-align: center; }
    input { width: 90%; padding: 6px; margin: 6px 0; text-align: center; box-sizing: border-box; }
    button { width: 90%; padding: 7px 12px; margin-top: 6px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #999; cursor: not-allowed; }
    #status { font-size: 12px; color: green; margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>InnoCode Guardian</h3>
  <p id="instruction" style="font-size: 11px;">Enter your Room Code and Team/Device Name:</p>
  <input type="text" id="roomCodeInput" placeholder="Room Code (e.g. LAB-A)" style="text-transform: uppercase;">
  <input type="text" id="deviceNameInput" placeholder="Team Name (e.g. Team-01)">
  <button id="saveBtn">Save & Register</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
