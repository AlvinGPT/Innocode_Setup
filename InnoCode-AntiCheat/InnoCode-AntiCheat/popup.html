<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; font-family: sans-serif; padding: 10px; text-align: center; }
    input { width: 90%; padding: 6px; margin: 8px 0; text-align: center; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { font-size: 12px; color: green; margin-top: 5px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>InnoCode Guardian</h3>
  <p id="instruction" style="font-size: 11px;">Enter your assigned team/device name:</p>
  <input type="text" id="deviceNameInput" placeholder="e.g. Team-Alpha-01">
  <br>
  <button id="saveBtn">Save & Register</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
